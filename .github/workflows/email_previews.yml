name: Email Previews
# By hand: one of every email Actuent sends, with sample data, to hello@localilabs.com (email_previews.ts).
on:
  workflow_dispatch:
    inputs:
      to:
        description: 'Send the previews to'
        default: 'hello@localilabs.com'
jobs:
  previews:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npx tsx email_previews.ts
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          PREVIEW_TO: ${{ github.event.inputs.to }}
