name: Inspect Domains
on:
  workflow_dispatch:
    inputs:
      domains:
        description: 'Domains, separated by spaces'
        required: false
      queries:
        description: 'Searches to time, separated by |'
        required: false
      sizes:
        description: 'Show database table sizes (1 = yes)'
        required: false
      ping:
        description: 'Time 10 tiny requests (1 = yes)'
        required: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npx tsx inspect.ts
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DOMAINS: ${{ inputs.domains }}
          QUERIES: ${{ inputs.queries }}
          SIZES: ${{ inputs.sizes }}
          PING: ${{ inputs.ping }}
