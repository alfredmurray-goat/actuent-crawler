name: Live Assistant Test
# Weekly (Monday morning; all questions) and in launch week every 3 hours (a rotating quarter): an AI assistant answers launch questions
# with Actuent's MCP tools (live_test.ts). Fails below 80%, so GitHub emails the failure.
on:
  schedule:
    - cron: '0 6 * * 1'
    - cron: '15 */3 13-20 10 *' # launch week: every 3 hours, a quarter of the questions each time
  workflow_dispatch:
    inputs:
      only:
        description: 'Only these question numbers (comma-separated); empty = all'
        default: ''
        required: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npx tsx live_test.ts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          ONLY: ${{ github.event.inputs.only }}
          ROTATE: ${{ github.event_name == 'schedule' && github.event.schedule != '0 6 * * 1' && '4' || '' }}
