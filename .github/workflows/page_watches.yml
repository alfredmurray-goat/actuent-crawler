name: Page Watches
# Daily: watched pages (actuent_watch_page) are read live; users hear when they change (page_watches.ts).
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
jobs:
  watches:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npx tsx page_watches.ts
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
