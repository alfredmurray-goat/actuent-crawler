name: Prune Old Data
on:
  schedule:
    - cron: '0 5 * * 3'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only count what would be deleted'
        type: boolean
        default: true
jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npx tsx prune_data.ts
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
