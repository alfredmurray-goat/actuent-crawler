name: Search Speed Alert
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
jobs:
  speed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install
      - run: npx tsx speed_alert.ts
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
