name: Weekly Backup
# Sundays: an encrypted backup of accounts, keys (hashed), watches, sign-ups and the sites table
# (backup.ts). Kept 35 days as a workflow artifact; only the Supabase service key can open it.
on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npx tsx backup.ts
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: actuent-backup
          path: backup/*.bin
          retention-days: 35
