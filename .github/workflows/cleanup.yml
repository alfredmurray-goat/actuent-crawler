name: Diff Cleanup
on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete diffs older than 90 days
        run: |
          curl --fail-with-body -X DELETE \
            "https://bcmwypjrahtxogytsvuc.supabase.co/rest/v1/lawp_diffs?detected_at=lt.$(date -d '90 days ago' -u +%Y-%m-%dT%H:%M:%SZ)" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY"
          echo "Cleanup done"
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
