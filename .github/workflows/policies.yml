name: Shop Policies
# Weekly: returns and shipping policy pages of the best-known shops (policies.ts; no LLM).
on:
  schedule:
    - cron: '30 5 * * 3'
  workflow_dispatch:
jobs:
  policies:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npx tsx policies.ts
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
