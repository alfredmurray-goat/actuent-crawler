name: Re-check Top Site Categories
# Nightly: the AI re-checks categories of the 20,000 best-known sites, 2,000 a night (recategorize_top.ts).
on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'How many sites this run'
        default: '2000'
        required: false
      domains:
        description: 'Or just these domains (space separated)'
        required: false
jobs:
  recategorize:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install
      - run: npx tsx recategorize_top.ts
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          RECATEGORIZE_LIMIT: ${{ inputs.limit || '2000' }}
          DOMAINS: ${{ inputs.domains }}
          TIME_BUDGET_MIN: '80'
