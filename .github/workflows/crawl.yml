name: Actuent Mass Crawler
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max NEW sites to crawl this run (35K takes about 4 hours; indexed sites are skipped for free)'
        default: '35000'
        required: false
      minutes:
        description: 'Time budget in minutes before the run stops and saves its position'
        default: '320'
        required: false
# Never run two crawls at once — they would read the same offset and duplicate work.
concurrency:
  group: mass-crawler
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download Tranco list
        run: |
          curl -L "https://tranco-list.eu/top-1m.csv.zip" -o tranco.zip
          unzip tranco.zip
          mv top-1m.csv tranco_PY69J.csv
      - name: Install dependencies
        run: npm install
      - name: Run crawler
        run: npx tsx crawl.ts
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CRAWL_LIMIT: ${{ inputs.limit || '35000' }}
          TIME_BUDGET_MIN: ${{ inputs.minutes || '320' }}
