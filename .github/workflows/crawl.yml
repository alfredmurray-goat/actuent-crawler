name: Actuent Mass Crawler
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Sites to save WITH real content this run (blocked/minimal ones top it up; stops at the time budget)'
        default: '20000'
        required: false
      ignore_backlog:
        description: 'Crawl new sites even while the backlog is being retried'
        default: 'false'
        required: false
      minutes:
        description: 'Time budget in minutes before the run stops and saves its position'
        default: '320'
        required: false
# Never run two crawls at once — they would read the same offset and duplicate work.
concurrency:
  group: mass-crawler
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download Tranco list
        run: |
          curl -L "https://tranco-list.eu/top-1m.csv.zip" -o tranco.zip
          unzip tranco.zip
          mv top-1m.csv tranco_PY69J.csv
      - name: Install dependencies
        run: npm install
      - name: Run crawler
        run: npx tsx crawl.ts
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CRAWL_LIMIT: ${{ inputs.limit || '20000' }}
          TIME_BUDGET_MIN: ${{ inputs.minutes || '320' }}
          IGNORE_BACKLOG: ${{ inputs.ignore_backlog || 'false' }}
