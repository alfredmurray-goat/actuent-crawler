name: Reconvert Minimal Sites
on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'How many backlog sites to try this run'
        default: '8000'
        required: false
concurrency:
  group: reconvert
  cancel-in-progress: false
jobs:
  reconvert:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx tsx reconvert.ts
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          RECONVERT_LIMIT: ${{ inputs.limit || '8000' }}
          TIME_BUDGET_MIN: '150'
