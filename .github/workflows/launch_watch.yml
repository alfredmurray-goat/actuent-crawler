name: Launch Watch
# Launch days (13–16 Oct), hourly: empty searches, busy answers and reported wrong answers (launch_watch.ts).
on:
  schedule:
    - cron: '5 * 13-16 10 *'
  workflow_dispatch:
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npx tsx launch_watch.ts
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
