name: Daily Endpoint Checks
on:
  schedule:
    - cron: '15 7 * * *'
  workflow_dispatch:
concurrency:
  group: endpoint-checks
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npx tsx endpoint_checks.ts
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
