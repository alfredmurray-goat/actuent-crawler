name: Venue Events
on:
  schedule:
    - cron: '0 3 * * 1,4'
    # Launch week: every day, so tonight's shows are always there (the heavy venue crawl stays paused).
    - cron: '30 3 12-20 10 *'
  workflow_dispatch:
    inputs:
      readers_only:
        description: 'Only these venue readers (comma-separated domains, or "all"); empty = full run'
        default: ''
        required: false
jobs:
  events:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install
      - run: npx tsx venue_events.ts
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          READERS_ONLY: ${{ github.event.inputs.readers_only }}
