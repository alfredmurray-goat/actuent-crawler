name: Slim Site Rows
# Nightly: duplicate intents, duplicate actions and empty or repeated pages out of site rows (slim_sites.ts).
# By hand only: measured 2026-10-08 at ~8–10 MB to gain over the whole table, so not worth rewriting
# rows nightly; the space is dead rows that only `vacuum full lawp_sites` frees.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only measure (1) or change (empty)'
        default: '1'
      slice:
        description: 'Domains starting with (0 = digits); empty = tonight''s'
        default: ''
jobs:
  slim:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npx tsx slim_sites.ts
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          SLICE: ${{ github.event.inputs.slice }}
