name: English Summaries for Foreign Sites
# Nightly: only sites that still just say "a Danish-language website at …" get a real English
# summary from the AI (reconvert.ts with FOREIGN_ONLY=1). Shares the reconvert queue, so the two
# never run at the same time.
on:
  schedule:
    - cron: '45 1 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'How many backlog sites to try this run'
        default: '3000'
        required: false
concurrency:
  group: reconvert
  cancel-in-progress: false
jobs:
  reconvert:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install
      - run: npx tsx reconvert.ts
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          RECONVERT_LIMIT: ${{ inputs.limit || '3000' }}
          FOREIGN_ONLY: '1'
          RECONVERT_CONCURRENCY: '10'
          TIME_BUDGET_MIN: '80'
